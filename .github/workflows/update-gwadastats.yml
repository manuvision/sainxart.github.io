name: Update Gwada Stats

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-gwadastats.yml'
      - 'scripts/gwadastats/**'

concurrency:
  group: gwadastats-source-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: |
            gwadastats
            scripts/gwadastats
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source parsing
        run: python3 -m unittest discover -s scripts/gwadastats -p 'test_*.py' -v
      - name: Check public reports
        id: collect
        continue-on-error: true
        run: python3 scripts/gwadastats/update_stats.py --data gwadastats/data.json --status gwadastats/update-status.json
      - name: Validate the published record
        run: node scripts/gwadastats/verify-data.mjs
      - name: Save verified data and check status
        run: |
          git add -- gwadastats/data.json gwadastats/update-status.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified Gwada Stats reports'
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Request GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify the public data
        run: python3 scripts/gwadastats/verify_public.py
      - name: Report source health
        if: always() && steps.collect.outcome != 'skipped'
        run: python3 scripts/gwadastats/report_status.py
